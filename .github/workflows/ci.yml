name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "No explicit Xcode.app found — keeping runner default"
            xcode-select -p
          fi

      - name: Print environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: xcrun swift build -v

      - name: Test
        env:
          # GitHub 托管 runner 无真实显示刷新/音频设备:依赖真实 AV 设备的
          # 时序/接线路由用例在 CI 上随机挂(同一 commit 两次 run 一过一挂)。
          # 这些用例在本地/真机全量覆盖,CI 显式跳过。
          PLAYERKIT_CI_SKIP_AV_DEVICE_TESTS: "1"
        run: xcrun swift test --parallel

  lint:
    name: SwiftFormat (dry run)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          # No swift-format installed by default — skip until added.
          echo "swift-format check disabled (tool not yet wired)."

  docs:
    name: Generate Docs
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Dump symbol graph
        # Best-effort: newer toolchains also try to emit a graph for the test
        # target and fail ("Couldn't load module 'PlayerKitPackageTests'" —
        # not an importable module). Keep going; DocC falls back to its
        # fallback-display-name when symbol graphs are missing.
        run: xcrun swift package dump-symbol-graph --minimum-access-level public || true
      - name: Generate DocC archive
        run: |
          mkdir -p .build/docs
          EXTRA=()
          for d in .build/*/symbolgraph; do [ -d "$d" ] && EXTRA+=(--additional-symbol-graph-dir "$d"); done
          xcrun docc convert "${EXTRA[@]}" \
            --output-dir .build/docs \
            --fallback-display-name PlayerKit \
            --fallback-bundle-identifier io.zyno.PlayerKit \
            || echo "::warning::docc convert failed — packaging fallback docs skeleton"
      - name: Package docs archive
        run: mkdir -p .build/docs && tar -czf PlayerKit-docs.tar.gz -C .build docs
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayerKit-docs
          path: PlayerKit-docs.tar.gz
